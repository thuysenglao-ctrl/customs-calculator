<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

// ---- Supabase auth (login gate) ----
const SUPABASE_URL = "https://phewdthjqznddszngyuc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBoZXdkdGhqcXpuZGRzem5neXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MjEzNzIsImV4cCI6MjEwMjA5NzM3Mn0.-_ZtSZVACXcnosa5xw00HWgqmtCbevnwFkQPfRwfe5A";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---- simple inline icons (no external icon library needed) ----
const Icon = ({ children, size = 16 }) => (
  <span style={{ fontSize: size, lineHeight: 1, display: "inline-flex" }}>{children}</span>
);
const IconPlus = () => <Icon>➕</Icon>;
const IconTrash = () => <Icon size={14}>🗑️</Icon>;
const IconChevronDown = () => <Icon size={16}>▾</Icon>;
const IconChevronUp = () => <Icon size={16}>▴</Icon>;
const IconPackage = () => <Icon size={13}>📦</Icon>;
const IconStamp = () => <Icon size={18}>🔖</Icon>;
const IconExcel = () => <Icon>📊</Icon>;
const IconPrint = () => <Icon>🖨️</Icon>;
const IconSearch = () => <Icon size={14}>🔍</Icon>;

// ---- helpers -------------------------------------------------

const roundUp100 = (n) => Math.ceil((n || 0) / 100) * 100;
const fmt = (n) =>
  (n || 0).toLocaleString("lo-LA", { maximumFractionDigits: 2 });

const DEFAULT_SETTINGS = {
  primary: "#0f3d3e",
  accent: "#c9a35d",
  bg: "#f4f1e8",
  rate: "22529",
  duty: "5",
  excise: "0",
  vat: "10",
  other: "0",
  orgName: "ດ່ານພາສີ · ລະບົບຄິດໄລ່",
};

const emptyItem = (defaults = DEFAULT_SETTINGS) => ({
  id: Math.random().toString(36).slice(2) + Date.now(),
  name: "",
  nameEn: "",
  qty: "",
  unit: "ກລ",
  hsCode: "",
  grossWeight: "",
  netWeight: "",
  unitPrice: "",
  dutyRate: defaults.duty ?? "5",
  exciseRate: defaults.excise ?? "0",
  vatRate: defaults.vat ?? "10",
  otherRate: defaults.other ?? "0",
});

const DEFAULT_DOC_META = {
  consignee: "",
  address: "",
  transportMode: "",
  invoiceNo: "",
  invoiceDate: "",
  from: "",
  declarerName: "",
  declarerPhone: "",
  carrierName: "",
  importerName: "",
  declareDate: "",
};

const makeSheet = (name, defaults = DEFAULT_SETTINGS) => ({
  id: Math.random().toString(36).slice(2) + Date.now(),
  name,
  plate: "",
  globalRate: defaults.rate || "22529",
  docMeta: { ...DEFAULT_DOC_META },
  items: [emptyItem(defaults)],
});

function computeItem(it, globalRate) {
  const qty = parseFloat(it.qty) || 0;
  const unitPrice = parseFloat(it.unitPrice) || 0;
  const usd = qty * unitPrice;
  const rate = parseFloat(globalRate) || 0;
  const dutyRate = (parseFloat(it.dutyRate) || 0) / 100;
  const exciseRate = (parseFloat(it.exciseRate) || 0) / 100;
  const vatRate = (parseFloat(it.vatRate) || 0) / 100;

  const customsValue = usd * rate;
  const duty = roundUp100(customsValue * dutyRate);
  const exciseBase = customsValue + duty;
  const excise = roundUp100(exciseBase * exciseRate);
  const vatBase = exciseBase + excise;
  const vat = roundUp100(vatBase * vatRate);
  const totalTax = duty + excise + vat;

  return { usd, customsValue, duty, exciseBase, excise, vatBase, vat, totalTax };
}

// ---- keyboard: move to next input on Enter ----------------------

function focusNextField(e) {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const focusable = Array.from(
    document.querySelectorAll('input:not([disabled]):not([readonly])')
  );
  const idx = focusable.indexOf(e.target);
  if (idx > -1 && idx < focusable.length - 1) {
    const next = focusable[idx + 1];
    next.focus();
    if (next.select) next.select();
  } else {
    e.target.blur();
  }
}

// ---- field ----------------------------------------------------

function Field({ label, value, onChange, suffix, type = "text", placeholder }) {
  return (
    <label className="field">
      {label && <span className="field-label">{label}</span>}
      <div className="field-box">
        <input
          type={type}
          inputMode={type === "number" ? "decimal" : "text"}
          value={value}
          placeholder={placeholder}
          onChange={(e) => onChange(e.target.value)}
          onKeyDown={focusNextField}
          onWheel={(e) => type === "number" && e.target.blur()}
        />
        {suffix && <span className="field-suffix">{suffix}</span>}
      </div>
    </label>
  );
}

// ---- HS code search / autocomplete field -----------------------

function HsSearchField({ item, onPick }) {
  const [query, setQuery] = useState(item.name || "");
  const [open, setOpen] = useState(false);
  const boxRef = useRef(null);

  useEffect(() => setQuery(item.name || ""), [item.id]);

  useEffect(() => {
    function onClickOutside(e) {
      if (boxRef.current && !boxRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onClickOutside);
    document.addEventListener("touchstart", onClickOutside);
    return () => {
      document.removeEventListener("mousedown", onClickOutside);
      document.removeEventListener("touchstart", onClickOutside);
    };
  }, []);

  const LEADING_VOWELS = ["ເ", "ແ", "ໂ", "ໃ", "ໄ"];
  const matchesName = (n, q) => {
    const nl = n.toLowerCase();
    if (nl.startsWith(q)) return true;
    if (q && LEADING_VOWELS.includes(nl[0]) && nl.slice(1).startsWith(q)) return true;
    return false;
  };

  const matches = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return HS_DATA.filter(
      (d) => matchesName(d.n, q) || d.c.toLowerCase().startsWith(q)
    );
  }, [query]);

  const pick = (d) => {
    setQuery(d.n);
    setOpen(false);
    onPick(d);
  };

  return (
    <div className="dropdown" ref={boxRef}>
      <span className="field-label">ຊື່ສິນຄ້າ / ຄົ້ນຫາ HS Code</span>
      <div className="field-box">
        <span className="search-icon"><IconSearch /></span>
        <input
          type="text"
          value={query}
          placeholder="ພິມຊື່ສິນຄ້າ ຫຼື ລະຫັດ HS ເພື່ອຄົ້ນຫາ..."
          onChange={(e) => {
            setQuery(e.target.value);
            onPick({ n: e.target.value }, true);
            setOpen(true);
          }}
          onFocus={() => setOpen(true)}
          onKeyDown={(e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              if (open && matches.length > 0) {
                pick(matches[0]);
              } else {
                focusNextField(e);
              }
            }
          }}
        />
      </div>

      {open && matches.length > 0 && (
        <div className="dropdown-list">
          {matches.map((d, i) => (
            <button key={d.c + i} className="dropdown-item" onClick={() => pick(d)}>
              <div className="dropdown-item-name">{d.n}</div>
              <div className="dropdown-item-meta">
                {d.c} · {d.u} · ອ້າງອີງ ${d.p} · ພາສີ {d.d}%
              </div>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

const REMEMBER_KEY = "customs_calc_remember";
function loadRemembered() {
  try {
    const raw = localStorage.getItem(REMEMBER_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function saveRemembered(email, password) {
  try {
    localStorage.setItem(REMEMBER_KEY, JSON.stringify({ email, password }));
  } catch (e) {}
}
function clearRemembered() {
  try {
    localStorage.removeItem(REMEMBER_KEY);
  } catch (e) {}
}

function LoginScreen() {
  const remembered = loadRemembered();
  const [email, setEmail] = useState(remembered ? remembered.email : "");
  const [password, setPassword] = useState(remembered ? remembered.password : "");
  const [remember, setRemember] = useState(!!remembered);
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  const handleLogin = async () => {
    if (!email || !password) return;
    setError("");
    setLoading(true);
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) {
      setError("ອີເມວ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ");
      return;
    }
    if (remember) {
      saveRemembered(email, password);
    } else {
      clearRemembered();
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter") handleLogin();
  };

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-kicker">ດ່ານພາສີ · ລະບົບຄິດໄລ່</div>

          type="email"
          className="login-input"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="ອີເມວ"
          autoCapitalize="none"
        />
        <input
          type="password"
          className="login-input"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="ລະຫັດຜ່ານ"
        />
        <label className="login-remember">
          <input
            type="checkbox"
            checked={remember}
            onChange={(e) => setRemember(e.target.checked)}
          />
          ຈື່ອີເມວ ແລະ ລະຫັດຜ່ານໄວ້
        </label>
        {error && <div className="login-error">{error}</div>}
        <button className="login-btn" onClick={handleLogin} disabled={loading}>
          {loading ? "ກຳລັງເຂົ້າສູ່ລະບົບ..." : "ເຂົ້າສູ່ລະບົບ"}
        </button>
      </div>
    </div>
  );
}

function AuthGate() {
  const [session, setSession] = useState(undefined); // undefined = checking, null = logged out
  const [cloudData, setCloudData] = useState(undefined); // undefined = loading, null = none saved yet

  useEffect(() => {
    let settled = false;
    supabaseClient.auth.getSession().then(({ data }) => {
      settled = true;
      setSession(data.session);
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, sess) => {
      settled = true;
      setSession(sess);
      if (!sess) setCloudData(undefined);
    });
    // Safety net: if Supabase never responds (network issue), don't hang forever.
    const timeout = setTimeout(() => {
      if (!settled) setSession(null);
    }, 8000);
    return () => {
      listener.subscription.unsubscribe();
      clearTimeout(timeout);
    };
  }, []);

  useEffect(() => {
    if (!session) return;
    let cancelled = false;
    supabaseClient
      .from("sheets")
      .select("data")
      .eq("user_id", session.user.id)
      .maybeSingle()
      .then(({ data, error }) => {
        if (cancelled) return;
        if (error || !data) {
          setCloudData(null);
        } else {
          setCloudData(data.data || null);
        }
      });
    // Safety net: if the cloud fetch never responds, fall back to empty data
    // instead of leaving the user stuck on "ກຳລັງໂຫລດຂໍ້ມູນ..." forever.
    const timeout = setTimeout(() => {
      if (!cancelled) setCloudData((prev) => (prev === undefined ? null : prev));
    }, 8000);
    return () => {
      cancelled = true;
      clearTimeout(timeout);
    };
  }, [session]);

  const saveToCloud = (payload) => {
    if (!session) return;
    supabaseClient
      .from("sheets")
      .upsert({ user_id: session.user.id, data: payload, updated_at: new Date().toISOString() })
      .then(() => {});
  };

  if (session === undefined) {
    return (
      <div className="login-wrap">
        <div className="login-loading">ກຳລັງໂຫລດ...</div>
      </div>
    );
  }
  if (!session) {
    return <LoginScreen />;
  }
  if (cloudData === undefined) {
    return (
      <div className="login-wrap">
        <div className="login-loading">ກຳລັງໂຫລດຂໍ້ມູນ...</div>
      </div>
    );
  }
  return (
    <CustomsCalculator
      userEmail={session.user.email}
      onLogout={() => supabaseClient.auth.signOut()}
      initialData={cloudData}
      onSave={saveToCloud}
    />
  );
}

function CustomsCalculator({ userEmail, onLogout, initialData, onSave }) {
  const [settings, setSettings] = useState({
    ...DEFAULT_SETTINGS,
    ...(initialData && initialData.settings ? initialData.settings : {}),
  });
  const [settingsOpen, setSettingsOpen] = useState(false);

  useEffect(() => {

    root.setProperty("--color-primary", settings.primary || DEFAULT_SETTINGS.primary);
    root.setProperty("--color-accent", settings.accent || DEFAULT_SETTINGS.accent);
    root.setProperty("--color-bg", settings.bg || DEFAULT_SETTINGS.bg);
  }, [settings.primary, settings.accent, settings.bg]);

  const [sheets, setSheets] = useState(
    initialData && initialData.sheets && initialData.sheets.length
      ? initialData.sheets
      : [makeSheet("ລູກຄ້າ 1", settings)]
  );
  const [activeId, setActiveId] = useState(
    initialData && initialData.activeId ? initialData.activeId : sheets[0].id
  );
  const activeSheet = sheets.find((s) => s.id === activeId) || sheets[0];

  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | saved
  const saveTimer = useRef(null);
  const firstRun = useRef(true);
  useEffect(() => {
    if (firstRun.current) {
      firstRun.current = false;
      return;
    }
    setSaveStatus("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      onSave && onSave({ sheets, activeId, settings });
      setSaveStatus("saved");
      setTimeout(() => setSaveStatus("idle"), 1500);
    }, 800);
    return () => clearTimeout(saveTimer.current);
  }, [sheets, activeId, settings]);

  const updateSheet = (patch) =>
    setSheets((prev) => prev.map((s) => (s.id === activeId ? { ...s, ...patch } : s)));

  const docMeta = { ...DEFAULT_DOC_META, ...(activeSheet.docMeta || {}) };
  const setDocMeta = (patch) => updateSheet({ docMeta: { ...docMeta, ...patch } });
  const [invoiceModalOpen, setInvoiceModalOpen] = useState(false);
  const [declarationModalOpen, setDeclarationModalOpen] = useState(false);
  const [printMode, setPrintMode] = useState("calc");

  const plate = activeSheet.plate;
  const setPlate = (v) => updateSheet({ plate: v });
  const globalRate = activeSheet.globalRate;
  const setGlobalRate = (v) => updateSheet({ globalRate: v });
  const items = activeSheet.items;
  const setItems = (updater) =>
    updateSheet({ items: typeof updater === "function" ? updater(activeSheet.items) : updater });

  const addSheet = () => {
    const next = makeSheet(`ລູກຄ້າ ${sheets.length + 1}`, settings);
    setSheets((prev) => [...prev, next]);
    setActiveId(next.id);
  };
  const removeSheet = (id) => {

    const ok = window.confirm("ລຶບລູກຄ້ານີ້ອອກ? ຂໍ້ມູນທັງໝົດຈະຫາຍໄປ.");
    if (!ok) return;
    setSheets((prev) => {
      const next = prev.filter((s) => s.id !== id);
      if (id === activeId) setActiveId(next[0].id);
      return next;
    });

  const renameSheet = (id) => {

  const results = useMemo(() => items.map((it) => computeItem(it, globalRate)), [items, globalRate]);

    "ນ້ຳໜັກລວມ (ກລ)", "ນ້ຳໜັກຈິງ (ກລ)", "ລາຄາຕໍ່ຫົວໜ່ວຍ (USD)",

    ws["!cols"] = headers.map(() => ({ wch: 14 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ໃບຄິດໄລ່ພາສີ");
    XLSX.writeFile(wb, `ໃບຄິດໄລ່ພາສີ_${activeSheet.name}${plate ? "_" + plate : ""}.xlsx`);
  };

  const exportPdf = () => {
    setPrintMode("calc");
    setTimeout(() => window.print(), 50);
  };
  const printInvoicePdf = () => {
    setPrintMode("invoice");
    setTimeout(() => window.print(), 50);
  };
  const printDeclarationPdf = () => {
    setPrintMode("declaration");
    setTimeout(() => window.print(), 50);
  };

  // ---- Export: Invoice (English) — matches Copy_of_INVOICE_IM4.xlsx layout ----
  const exportInvoiceEN = () => {
    const rows = [
      [settings.orgName || DEFAULT_SETTINGS.orgName],
      [""],
      ["INVOICE"],
      ["CONSIGNEE:", docMeta.consignee, "", "", "", "", "", "", "", "", "No:", docMeta.invoiceNo],
      ["Add:", docMeta.address, "", "", "", "", "", "", "", "", "DATE:", docMeta.invoiceDate],
      ["MODE OF TRANSPORT:", docMeta.transportMode, "", "", "", "", "", "", "", "", "FROM:", docMeta.from],
      [],
      ["NO", "Descripstion of goods", "", "", "Quantity", "", "Unit Price\n(USD)", "", "Amount\n(USD)", "", "G.W\n( kgs )", "", "N.W\n(kgs)"],
      [],
    ];
    items.forEach((it, i) => {
      const r = results[i];
      rows.push([
        i + 1,
        it.nameEn || it.name || "",
        "", "",
        parseFloat(it.qty) || 0, "",
        parseFloat(it.unitPrice) || 0, "",
        Math.round((r.usd || 0) * 100) / 100, "",
        parseFloat(it.grossWeight) || 0, "",
        parseFloat(it.netWeight) || 0,
      ]);
    });
    const totalUsd = results.reduce((s, r) => s + (r.usd || 0), 0);
    const totalGw = items.reduce((s, it) => s + (parseFloat(it.grossWeight) || 0), 0);
    const totalNw = items.reduce((s, it) => s + (parseFloat(it.netWeight) || 0), 0);
    rows.push([]);
    rows.push(["TOTAL", "", "", "", "", "", "", "", Math.round(totalUsd * 100) / 100, "", totalGw, "", totalNw]);
    rows.push([]);
    rows.push(["", "", "", "", "", "", settings.orgName || DEFAULT_SETTINGS.orgName]);

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 6 }, { wch: 24 }, { wch: 4 }, { wch: 4 }, { wch: 10 }, { wch: 4 }, { wch: 12 }, { wch: 4 }, { wch: 12 }, { wch: 4 }, { wch: 10 }, { wch: 4 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "INVOICE");
    XLSX.writeFile(wb, `INVOICE_${activeSheet.name}${plate ? "_" + plate : ""}.xlsx`);
  };

  // ---- Export: ໃບແຈ້ງພາສີໂດຍສັງເຂບ — matches the customs summary declaration layout ----
  const exportCustomsDeclaration = () => {
    const rows = [
      ["ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ"],
      ["ສັນຕິພາບ ເອກະລາດ ປະຊາທິປະໄຕ ເອກະພາບ ວັດທະນາຖາວອນ"],
      [""],
      ["", "ພາສີປະຈໍາແຂວງ ...................", "", "", "", "", "", "", "ເລກທີ:......../TCS"],
      ["", "ດ່ານພາສີສາກົນ ...................", "", "", "", "", "", "", "ວັນທີ:........................"],
      [],
      ["ໃບແຈ້ງພາສີໂດຍສັງເຂບ"],
      [`ຊື່ ແລະນາມສະກຸນຜູ້ແຈ້ງສິນຄ້າ: ${docMeta.declarerName || "...................................................."}  ເບີໂທລະສັບ: ${docMeta.declarerPhone || "......................"}`],
      [`ຊື່ຜູ້ຂົນສົ່ງ: ${docMeta.carrierName || ".................................."} ທະບຽນລົດ: ${plate || ".................................."} ຊື່ຜູ້ນຳເຂົ້າ: ${docMeta.importerName || ".................................."}`],
      [`ລົງວັນທີ: ${docMeta.declareDate || ".................................."} ໃບແຈ້ງລາຄາ (Invoice) ເລກທີ: ${docMeta.invoiceNo || ".................."} ລູກຄ້າ: ${activeSheet.name}`],
      [],
      ["ລ/ດ", "ລະຫັດສີນຄ້າ", "ຊະນິດສິນຄ້າ", "ຈໍານວນ", "ຫົວໜ່ວຍ", "ລາຄາ $ ຕໍ່ຫົວໜ່ວຍ", "ລວມເປັນເງິນ $", "ນໍ້າໜັກລວມ", "ນໍ້າໜັກຈິງ", "ໃບອະນຸຍາດນຳເຂົ້າ", "", "", "ເຂົ້າສາງວັນທີ"],
      ["", "", "", "", "", "", "", "", "", "ເລກທີ", "ວ,ດ,ປ", "ອອກໂດຍ", ""],
    ];
    items.forEach((it, i) => {
      const r = results[i];
      rows.push([
        i + 1,
        it.hsCode || "",
        it.name || "",
        parseFloat(it.qty) || 0,
        it.unit || "",
        parseFloat(it.unitPrice) || 0,
        Math.round((r.usd || 0) * 100) / 100,
        parseFloat(it.grossWeight) || 0,
        parseFloat(it.netWeight) || 0,
        "", "", "", "",
      ]);
    });
    const totalUsd = results.reduce((s, r) => s + (r.usd || 0), 0);
    const totalGw = items.reduce((s, it) => s + (parseFloat(it.grossWeight) || 0), 0);
    const totalNw = items.reduce((s, it) => s + (parseFloat(it.netWeight) || 0), 0);
    rows.push(["ລວມ", "", "", "", "", "", Math.round(totalUsd * 100) / 100, totalGw, totalNw]);
    rows.push([]);
    rows.push(["ຂ້າພະເຈົ້າຂໍຢັ້ງຢືນວ່າ ຂໍ້ມູນທີ່ໄດ້ແຈ້ງລົງໃນໃບແຈ້ງສິນຄ້າຊົ່ວຄາວສະບັບນີ້ ແມ່ນຖືກຕ້ອງຄົບຖ້ວນ"]);
    rows.push([]);
    rows.push(["", "ເຈົ້າໜ້າທີ່ພາສີ", "", "", "", "", "", "", "", "", "ລາຍເຊັນຜູ້ແຈ້ງສິນຄ້າ"]);

    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = [{ wch: 5 }, { wch: 12 }, { wch: 26 }, { wch: 9 }, { wch: 9 }, { wch: 12 }, { wch: 12 }, { wch: 10 }, { wch: 10 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 12 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "ໃບແຈ້ງພາສີ");
    XLSX.writeFile(wb, `ໃບແຈ້ງພາສີໂດຍສັງເຂບ_${activeSheet.name}${plate ? "_" + plate : ""}.xlsx`);
  };

  return (
    <div className="app">
      <div className="user-bar no-print">
        <span>
          👤 {userEmail}
          {saveStatus === "saving" && " · ກຳລັງບັນທຶກ..."}
          {saveStatus === "saved" && " · ບັນທຶກແລ້ວ ✓"}
        </span>
        <span style={{ display: "flex", gap: 6, flexShrink: 0 }}>
          <button onClick={() => setSettingsOpen(true)}>⚙️ ຕັ້ງຄ່າ</button>
          <button onClick={onLogout}>ອອກຈາກລະບົບ</button>
        </span>
      </div>
      <div className="header no-print">
        <div className="header-badge"></div>
        <div className="header-doc-btns">
          <button className="header-doc-btn" onClick={() => setInvoiceModalOpen(true)} title="ອອກໃບ Invoice (EN)">
            <span className="header-doc-btn-icon">🧾</span>
            <span className="header-doc-btn-label">Invoice</span>
          </button>
          <button className="header-doc-btn" onClick={() => setDeclarationModalOpen(true)} title="ອອກໃບແຈ້ງພາສີໂດຍສັງເຂບ">
            <span className="header-doc-btn-icon">📄</span>
            <span className="header-doc-btn-label">ໃບແຈ້ງ</span>
          </button>
        </div>
        <div className="kicker"><IconStamp /><span>{settings.orgName || DEFAULT_SETTINGS.orgName}</span></div>
        <h1 className="title">ຄິດໄລ່ຄ່າພາສີ-ອາກອນ<br />ສິນຄ້າຂາເຂົ້າ-ຂາອອກ</h1>
        <div style={{ marginTop: 16, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <Field value={plate} onChange={setPlate} placeholder="ໝາຍເລກທະບຽນລົດ (ຕົວເລືອກ)" />
          <Field value={globalRate} onChange={setGlobalRate} type="number" suffix="ກີບ/$1" placeholder="22529" />
        </div>
        <a
          href="https://www.bol.gov.la/ExchangRate"
          target="_blank"
          rel="noopener noreferrer"
          className="rate-link"
        >
          🔗 ອັດຕາແລກປ່ຽນທະນາຄານກາງ (BOL)
        </a>
        <a
          href="https://www.laotradeportal.gov.la/lo-la/site/listcommodity"
          target="_blank"
          rel="noopener noreferrer"
          className="rate-link"
        >
          🔗 ຄົ້ນຫາອັດຕາພາສີ (Lao Trade Portal)
        </a>
      </div>

      <div className="tabs no-print">
        {sheets.map((s) => (
          <button
            key={s.id}
            className={`tab ${s.id === activeId ? "active" : ""}`}
            onClick={() => setActiveId(s.id)}
            onDoubleClick={() => renameSheet(s.id)}
          >
            {s.name}
            {sheets.length > 1 && (
              <span
                className="tab-close"
                onClick={(e) => {
                  e.stopPropagation();
                  removeSheet(s.id);
                }}
              >
                ✕
              </span>
            )}
          </button>
        ))}
        <button className="tab-add" onClick={addSheet}><IconPlus /> ລູກຄ້າໃໝ່</button>
      </div>

      <div className="items no-print">
        {items.map((it, i) => (
          <ItemCard
            key={it.id}
            item={it}
            index={i}
            globalRate={globalRate}
            onChange={(next) => updateItem(it.id, next)}
            onRemove={() => removeItem(it.id)}
          />
        ))}

        <button className="add-btn" onClick={addItem}><IconPlus /> ເພີ່ມລາຍການສິນຄ້າ</button>

        <div className="export-row">
          <button className="export-btn excel" onClick={exportExcel}><IconExcel /> Export Excel</button>
          <button className="export-btn pdf" onClick={exportPdf}><IconPrint /> Export PDF</button>
          <button className="export-btn excel" onClick={() => setInvoiceModalOpen(true)}><IconExcel /> ອອກໃບ Invoice (EN)</button>
          <button className="export-btn excel" onClick={() => setDeclarationModalOpen(true)}><IconExcel /> ອອກໃບແຈ້ງພາສີໂດຍສັງເຂບ</button>
        </div>
      </div>

      {printMode === "calc" && (
        <div className="print-only print-report">
          {settings.orgName && <div className="print-org">{settings.orgName}</div>}
          <h1>ໃບຄິດໄລ່ຄ່າພາສີ-ອາກອນ ສິນຄ້າຂາເຂົ້າ-ຂາອອກ</h1>
          <div className="print-meta">
            <span>ລູກຄ້າ: {activeSheet.name} · ທະບຽນລົດ: {plate || "-"}</span>
            <span>ອັດຕາແລກປ່ຽນ 1$ = {fmt(globalRate)} ກີບ</span>
          </div>
          <table className="print-table">
            <thead><tr>{headers.map((h) => <th key={h}>{h}</th>)}</tr></thead>
            <tbody>
              {tableRows.map((row, i) => (
                <tr key={i}>{row.map((cell, j) => <td key={j}>{typeof cell === "number" ? fmt(cell) : cell}</td>)}</tr>
              ))}
            </tbody>
          </table>
          <div className="print-totals">
            <span>ລວມມູນຄ່າ: {fmt(grandCustomsValue)} ກີບ</span>
            <span style={{ fontWeight: 700 }}>ລວມພາສີ-ອາກອນທັງໝົດ: {fmt(grandTotalTax)} ກີບ</span>
          </div>
        </div>
      )}

      {printMode === "invoice" && (
        <div className="print-only print-report">
          <h1>INVOICE</h1>
          <div style={{ fontSize: 12, marginBottom: 12 }}>
            <div><strong>CONSIGNEE:</strong> {docMeta.consignee || "..................................."}</div>
            <div><strong>Address:</strong> {docMeta.address || "..................................."}</div>
            <div><strong>Mode of Transport:</strong> {docMeta.transportMode || "..................................."}</div>
            <div style={{ display: "flex", gap: 24, marginTop: 4 }}>
              <span><strong>No:</strong> {docMeta.invoiceNo || "........."}</span>
              <span><strong>Date:</strong> {docMeta.invoiceDate || "........."}</span>
              <span><strong>From:</strong> {docMeta.from || "........."}</span>
            </div>
          </div>
          <table className="print-table">
            <thead>
              <tr>
                <th>NO</th><th>Description of goods</th><th>Quantity</th><th>Unit</th>
                <th>Unit Price (USD)</th><th>Amount (USD)</th><th>G.W (kgs)</th><th>N.W (kgs)</th>
              </tr>
            </thead>
            <tbody>
              {items.map((it, i) => (
                <tr key={it.id}>
                  <td>{i + 1}</td>
                  <td>{it.nameEn || it.name}</td>
                  <td>{fmt(parseFloat(it.qty) || 0)}</td>
                  <td>{it.unit}</td>
                  <td>{fmt(parseFloat(it.unitPrice) || 0)}</td>
                  <td>{fmt(results[i]?.usd || 0)}</td>
                  <td>{fmt(parseFloat(it.grossWeight) || 0)}</td>
                  <td>{fmt(parseFloat(it.netWeight) || 0)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="print-totals">
            <span style={{ fontWeight: 700 }}>
              TOTAL: {fmt(results.reduce((s, r) => s + (r.usd || 0), 0))} USD ·
              G.W {fmt(items.reduce((s, it) => s + (parseFloat(it.grossWeight) || 0), 0))} kgs ·
              N.W {fmt(items.reduce((s, it) => s + (parseFloat(it.netWeight) || 0), 0))} kgs
            </span>
          </div>
        </div>
      )}

      {printMode === "declaration" && (
        <div className="print-only print-report">
          <div className="print-org">ສາທາລະນະລັດ ປະຊາທິປະໄຕ ປະຊາຊົນລາວ</div>
          <div className="print-org">ສັນຕິພາບ ເອກະລາດ ປະຊາທິປະໄຕ ເອກະພາບ ວັດທະນາຖາວອນ</div>
          <h1>ໃບແຈ້ງພາສີໂດຍສັງເຂບ</h1>
          <div style={{ fontSize: 12, marginBottom: 12 }}>
            <div>ຊື່ ແລະ ນາມສະກຸນຜູ້ແຈ້ງສິນຄ້າ: {docMeta.declarerName || "..................................."} ເບີໂທ: {docMeta.declarerPhone || "............"}</div>
            <div>ຊື່ຜູ້ຂົນສົ່ງ: {docMeta.carrierName || "................"} ທະບຽນລົດ: {plate || "................"} ຊື່ຜູ້ນຳເຂົ້າ: {docMeta.importerName || "................"}</div>
            <div>ລົງວັນທີ: {docMeta.declareDate || "............"} ໃບແຈ້ງລາຄາ (Invoice) ເລກທີ: {docMeta.invoiceNo || "............"} ວັນທີ: {docMeta.invoiceDate || "............"} ລູກຄ້າ: {activeSheet.name}</div>
          </div>
          <table className="print-table">
            <thead>
              <tr>
                <th>ລ/ດ</th><th>ລະຫັດສີນຄ້າ</th><th>ຊະນິດສີນຄ້າ</th><th>ຈໍານວນ</th><th>ຫົວໜ່ວຍ</th>
                <th>ລາຄາ $ ຕໍ່ຫົວໜ່ວຍ</th><th>ລວມເປັນເງິນ $</th><th>ນ້ຳໜັກລວມ</th><th>ນ້ຳໜັກຈິງ</th>
              </tr>
            </thead>
            <tbody>
              {items.map((it, i) => (
                <tr key={it.id}>
                  <td>{i + 1}</td>
                  <td>{it.hsCode}</td>
                  <td>{it.name}</td>
                  <td>{fmt(parseFloat(it.qty) || 0)}</td>
                  <td>{it.unit}</td>
                  <td>{fmt(parseFloat(it.unitPrice) || 0)}</td>
                  <td>{fmt(results[i]?.usd || 0)}</td>
                  <td>{fmt(parseFloat(it.grossWeight) || 0)}</td>
                  <td>{fmt(parseFloat(it.netWeight) || 0)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div className="print-totals">
            <span style={{ fontWeight: 700 }}>ລວມ: {fmt(results.reduce((s, r) => s + (r.usd || 0), 0))} USD</span>
          </div>
          <div style={{ fontSize: 11, marginTop: 20 }}>
            ຂ້າພະເຈົ້າຂໍຢັ້ງຢືນວ່າ ຂໍ້ມູນທີ່ໄດ້ແຈ້ງລົງໃນໃບແຈ້ງສິນຄ້າຊົ່ວຄາວສະບັບນີ້ ແມ່ນຖືກຕ້ອງຄົບຖ້ວນ
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 48, fontSize: 12 }}>
            <span>ເຈົ້າໜ້າທີ່ພາສີ</span>
            <span>ລາຍເຊັນຜູ້ແຈ້ງສິນຄ້າ</span>
          </div>
        </div>
      )}

      <div className="totalbar no-print">
        <div className="totalbar-meta"><IconPackage /><span>{activeSheet.name} · {items.length} ລາຍການ · ມູນຄ່າລວມ {fmt(grandCustomsValue)} ກີບ</span></div>
        <div className="totalbar-row">
          <span className="totalbar-label">ລວມຄ່າພາສີ-ອາກອນທັງໝົດ</span>
          <span className="totalbar-value">{fmt(grandTotalTax)} ກີບ</span>
        </div>
      </div>

      <SettingsPanel
        open={settingsOpen}
        onClose={() => {
          setSheets((prev) => prev.map((s) => ({ ...s, globalRate: settings.rate })));
          setSettingsOpen(false);
        }}
        settings={settings}
        onChange={setSettings}
      />

      <DocumentModal
        type="invoice"
        open={invoiceModalOpen}
        onClose={() => setInvoiceModalOpen(false)}
        docMeta={docMeta}
        onChange={setDocMeta}
        onExport={() => {
          exportInvoiceEN();
          setInvoiceModalOpen(false);
        }}
        onExportPdf={() => {
          setInvoiceModalOpen(false);
          printInvoicePdf();
        }}
      />

      <DocumentModal
        type="declaration"
        open={declarationModalOpen}
        onClose={() => setDeclarationModalOpen(false)}
        docMeta={docMeta}
        onChange={setDocMeta}
        onExport={() => {
          exportCustomsDeclaration();
          setDeclarationModalOpen(false);
        }}
        onExportPdf={() => {
          setDeclarationModalOpen(false);
          printDeclarationPdf();
        }}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AuthGate />);

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
